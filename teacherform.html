      <nav class="navbar navbar-expand-lg fixed-top navbar-dark" style="background-color:#3e2723">

        <button class="navbar-toggler" type="button" data-toggle="collapse" 
        data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" 
        aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav mr-auto">
            <li class="nav-item active">
              <a class="nav-link" href="index.htm">Home <span class="sr-only">(current)</span></a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-expanded="false">
                Sign-in as
              </a>
              <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                <a class="dropdown-item" href="collegeform.html">College Sign-in</a>
                <a class="dropdown-item active">Teacher Sign-in</a>
              </div>
            </li>
          </ul>
        </div>
      </nav>
    </div>

    <div class="fluid-container">
      <div class="row">
        <div class="col-md-12">
          <h1 style="margin-top:8%; background-color:#D6DBDF; color:black; padding:60px; text-align:center" class="heading_1"> Teacher Sign-in</h1>
        </div>
      </div>
    </div>
    <br>
    <br>
    <br>

    <div class="container heading_1">
      <div class="row">
        <div class="col-md-6">
          <div class="card">
            <img src="Image/teacher.jpeg" class="card-img-top" alt="Teacher Registration Image" height="100%" width="100%">
          </div>
        </div>
        <div class="col-md-6">
          <div class="card">
            <div class="card-body">
              <form><br><br><br><br><br><br>
                <div class="form-group">
                  <label for="email">Email address</label>
                  <input type="email" class="form-control" placeholder="Enter Email" id="email" required>
                </div>
                <div class="form-group">
                  <label for="password">Password</label>
                  <input type="password" class="form-control" placeholder="Enter Password" id="password" required>
                </div>
                <div>
                  <p>Not Registered? <a href="signup.html">Register Here</a></p>
                </div>
                <center><button type="submit" class="btn btn-primary">Sign in</button></center>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
