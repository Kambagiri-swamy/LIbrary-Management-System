<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>College Registration</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/style.css">
  </head>
  <body>
    <!-- Navigation Bar -->
    <div class="fluid-container">
      <nav class="navbar navbar-expand-lg fixed-top navbar-dark" style="background-color:#3e2723">
        <a class="navbar-brand" href="index.html">
          <img src="Image/Logo.png" width="140" height="80" alt="logo">
        </a>
        <button class="navbar-toggler" type="button" data-toggle="collapse" 
          data-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" 
          aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav mr-100%">
            <li class="nav-item active">
              <a class="nav-link" href="index.htm">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">About</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown">
                Sign-in as
              </a>
              <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                <a class="dropdown-item active" href="#">College Sign-in</a>
                <a class="dropdown-item" href="teacherform.html">Teacher Sign-in</a>
              </div>
            </li>
          </ul>
        </div>
      </nav>
    </div>

    <!-- Heading -->
    <div class="fluid-container">
      <div class="row">
        <div class="col-md-12">
          <h1 style="margin-top:8%; background-color:#D6DBDF; color:black; padding:60px; text-align:center">
            College Sign-in
          </h1>
        </div>
      </div>
    </div>

    <!-- Registration Form -->
    <div class="container heading_1">
      <div class="row">
        <div class="col-md-6">
          <div class="card">
            <img src="Image/College-Campus.jpg" class="card-img-top" alt="College Image">
          </div>
        </div>
        <div class="col-md-6">
          <div class="card">
            <div class="card-body">
              
              <form><br><br><br><br><br><br>
                <div class="form-group">
                  <label for="email">Email address</label>
                  <input type="email" class="form-control" placeholder="Enter Email" id="email" required>
                </div>
                <div class="form-group">
                  <label for="password">Password</label>
                  <input type="password" class="form-control" placeholder="Enter Password" id="password" required>
                </div>
                <div>
                  <p>Not Registered? <a href="signup.html">Register Here</a></p>
                </div>
                <center><button type="submit" class="btn btn-primary">Sign in</button></center>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- JS Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
